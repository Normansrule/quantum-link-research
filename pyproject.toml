[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-link-research"
version = "0.45.0"
description = "Physics-first simulation lab for quantum links from bench to Earth-Mars"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {text = "MIT"}

[tool.setuptools.packages.find]
include = ["qll*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
# A silent complex-to-real cast has hidden a physics bug three times (quantum_walk.std, qldpc.gf2_rank,
# decoders.repetition_memory); make it a test failure everywhere so the no-cloning scan catches the next one.
filterwarnings = ["error::numpy.exceptions.ComplexWarning"]
markers = [
  "phase1: Phase 1 constants, channels, thermal, QKD theory, systems",
  "phase2: Phase 2 circuits",
  "phase3: Phase 3 links and hardware",
  "phase4: Phase 4 network",
  "phase5: Phase 5 space segment",
  "phase6: Phase 6 application",
  "slow: long-running simulations",
  "browser: headless-Chromium page tests (need playwright and a browser)",
]
