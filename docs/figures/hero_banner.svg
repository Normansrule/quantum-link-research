<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-label="Quantum Link Research: talk to anywhere, as fast as light allows. A spacetime diagram of a message from Earth to Mars, with light at 45 degrees reaching Mars after one trip for a banked key and three trips for a key made on demand">
<rect width="1280" height="420" rx="18" fill="#111317"/>
<g font-family="Geist,Inter,Segoe UI,Helvetica,Arial,sans-serif">
  <path d="M64 68 l14 -22 l14 22" fill="none" stroke="#8593ff" stroke-width="3" stroke-linejoin="round"/>
  <text x="104" y="68" font-size="22" font-weight="600" fill="#e9ebef">Quantum Link Research</text>
  <text x="64" y="168" font-size="52" font-weight="650" letter-spacing="-1.5" fill="#e9ebef">Talk to anywhere,</text>
  <text x="64" y="228" font-size="52" font-weight="650" letter-spacing="-1.5" fill="#a4aab5">as fast as light allows.</text>
  <text x="64" y="284" font-size="18" fill="#a4aab5">Tested physics, interactive labs, and a staged two-room experiment toward</text>
  <text x="64" y="310" font-size="18" fill="#a4aab5">secure communication at the light-time floor, wherever the two ends are.</text>
</g>
<text x="64" y="386" font-family="Geist Mono,Menlo,Consolas,monospace" font-size="13" fill="#8a919d">τ = d/c  ·  F = (2f+1)/3  ·  K ≤ −log₂(1−η)  ·  3 of 6 memories outlast the 44.6-min Mars round trip</text>
<g font-family="Geist,Inter,Segoe UI,Helvetica,Arial,sans-serif">
  <text x="900" y="62" text-anchor="middle" font-size="15" font-weight="600" fill="#e9ebef">Earth</text>
  <text x="988" y="62" text-anchor="middle" font-size="15" font-weight="600" fill="#e9ebef">Mars</text>
  <text x="886" y="96" text-anchor="end" font-family="Geist Mono,Menlo,Consolas,monospace" font-size="12" fill="#8a919d">time ↓</text>
</g>
<line x1="900" y1="78" x2="900" y2="370" stroke="#2a2e36" stroke-width="1.5"/>
<line x1="988" y1="78" x2="988" y2="370" stroke="#2a2e36" stroke-width="1.5"/>
<polygon points="900,92 988,180 900,180" fill="#8593ff" fill-opacity=".10"/>
<path d="M900,92 L988,180 L900,268 L988,356" fill="none" stroke="#8593ff" stroke-opacity=".25" stroke-width="1.5" stroke-dasharray="4 5"/>
<path d="M900,92 L988,180 L900,268 L988,356" fill="none" stroke="#8593ff" stroke-width="2.2" stroke-dasharray="373.4 373.4" stroke-dashoffset="0">
  <animate attributeName="stroke-dashoffset" values="373.4;0;0" keyTimes="0;.72;1" dur="7.0s" calcMode="linear" repeatCount="indefinite"/>
</path>
<circle cx="900" cy="92" r="5.5" fill="#8593ff"/>
<circle cx="988" cy="180" r="5.5" fill="#8593ff"/><text x="1006" y="178" font-family="Geist,Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#e9ebef">Banked key</text><text x="1006" y="198" font-family="Geist,Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#8593ff">1 trip · 3.1–22.3 min</text><text x="1006" y="216" font-family="Geist,Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#8a919d">readable after one trip</text><circle cx="988" cy="356" r="5.5" fill="#8593ff"/><text x="1006" y="354" font-family="Geist,Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#e9ebef">Key made on demand</text><text x="1006" y="374" font-family="Geist,Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#8593ff">3 trips · 9.3–66.9 min</text><text x="1006" y="392" font-family="Geist,Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#8a919d">needs a round trip first</text>
</svg>