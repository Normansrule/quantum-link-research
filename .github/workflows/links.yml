name: links
on:
  schedule:
    - cron: "17 6 * * 1"   # weekly, Monday 06:17 UTC
  workflow_dispatch:
jobs:
  external-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --accept 200,206,301,302,403,429 --max-concurrency 4 --timeout 20 youtube/README.md docs/references.md experiments/bench/hardware_guide.md
          fail: true
