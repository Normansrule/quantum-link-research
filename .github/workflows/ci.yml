name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    name: ci
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: environment.yml
          activate-environment: qll
          auto-activate-base: false
      - run: python scripts/check_env.py
      - run: pytest -m phase1 -q
      - run: pytest -m "not slow" -q
      - run: python -m qll.systems.traceability
      - run: python scripts/make_figures.py
        env:
          MPLBACKEND: Agg
      - run: python scripts/build_reference_index.py
      - run: python scripts/build_site_data.py && python scripts/make_banner.py
  pages:
    name: website (headless Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest playwright
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q -m browser -p no:cacheprovider tests/test_pages_headless.py
